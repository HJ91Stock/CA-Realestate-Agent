<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA Real Estate Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#060a0e}
:root{--cc:#00ff88}
body{font-family:'IBM Plex Sans','Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#e0e0e0;display:flex;flex-direction:column}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1e2433;border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ── TOPBAR ── */
#topbar{height:52px;flex-shrink:0;background:rgba(4,7,12,.95);border-bottom:1px solid #111820;display:flex;align-items:center;padding:0 14px;gap:10px;z-index:60}
.logo-box{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#00d4ff,#00ff88);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#000;flex-shrink:0}
.logo-text .t1{font-size:12px;font-weight:700}
.logo-text .t2{font-size:9px;color:#3a4455;letter-spacing:.8px}
.spacer{flex:1}
.tsec{display:flex;align-items:center;gap:6px;border-right:1px solid #111820;padding-right:12px}
.tlabel{font-size:9px;color:#3a4455}
.tsel{background:#0d1117;border:1px solid #1a2030;border-radius:5px;padding:3px 7px;font-size:10px;color:#556;font-family:inherit;cursor:pointer}
.barwrap{width:60px;height:3px;background:#1a2030;border-radius:2px;overflow:hidden}
.barfill{height:100%;border-radius:2px;transition:width 1s linear}
.mono{font-size:9px;color:#445;font-family:‘DM Mono’,monospace}
.ptag{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 7px;font-weight:600;border:1px solid;white-space:nowrap}
.pdot{width:5px;height:5px;border-radius:50%;animation:pulse 1.5s infinite}

/* API key strip */
#key-strip{display:flex;align-items:center;gap:7px}
#key-inp{background:#0d1117;border:1px solid #1a2030;border-radius:6px;padding:5px 10px;font-size:11px;color:#aaa;font-family:‘DM Mono’,monospace;width:260px}
#key-inp::placeholder{color:#2a3040}
#key-inp:focus{outline:none;border-color:#334}
#key-btn{background:linear-gradient(135deg,#00d4ff,#00ff88);border:none;border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;color:#000;cursor:pointer;font-family:inherit;white-space:nowrap}
#key-btn:hover{filter:brightness(1.1)}
#key-ok{font-size:10px;color:#00ff88;display:none}
#key-err{font-size:10px;color:#ff6b6b;display:none}

/* sidebar toggle */
.stoggle{background:#0d1117;border:1px solid #1a2030;border-radius:6px;color:#556;cursor:pointer;font-size:12px;padding:4px 9px;transition:all .2s;flex-shrink:0}
.stoggle:hover{color:#aaa}

/* ── LAYOUT ── */
#layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:252px;flex-shrink:0;overflow:hidden;transition:width .25s ease;border-right:1px solid #111820;background:#080c10}
#sidebar.col{width:0;border-right:none}
#sb-inner{width:252px;height:100%;overflow-y:auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:10px}
.panel{background:#0a0e14;border:1px solid #111820;border-radius:9px;padding:11px}
.plabel{font-size:8px;color:#3a4455;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}
.catbtn{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 9px;cursor:pointer;color:#556;font-size:11px;text-align:left;font-family:inherit;transition:all .15s;margin-bottom:2px}
.catbtn:hover{transform:translateX(2px)}
.locchips{display:flex;flex-wrap:wrap;gap:4px}
.lchip{background:rgba(255,255,255,.02);border:1px solid #1a2030;border-radius:5px;padding:3px 8px;font-size:10px;color:#556;cursor:pointer;transition:all .15s;font-family:inherit}
.rtbtn{display:flex;flex-direction:column;width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;cursor:pointer;text-align:left;margin-bottom:2px;transition:all .15s;font-family:inherit}
.rtl{font-size:10px;color:#778;font-weight:500}
.rtd{font-size:8px;color:#334;margin-top:1px}
.inp{flex:1;min-width:0;background:#06090d;border:1px solid #1a2030;border-radius:5px;padding:4px 6px;font-size:9px;color:#aaa;font-family:inherit}
.inp::placeholder{color:#2a3040}
.inp:focus{outline:none;border-color:#334}
.inprow{display:flex;gap:5px;margin-bottom:6px}
.sep{color:#2a3040;align-self:center;font-size:9px}
.fsel{width:100%;background:#06090d;border:1px solid #1a2030;border-radius:5px;padding:4px 6px;font-size:9px;color:#aaa;font-family:inherit;cursor:pointer}
.fsubl{font-size:8px;color:#3a4455;margin-bottom:5px}
.custa{width:100%;background:#06090d;border:1px solid #1a2030;border-radius:5px;padding:6px 7px;font-size:10px;color:#aaa;resize:none;font-family:inherit;line-height:1.6}
.custa::placeholder{color:#2a3040}
.custa:focus{outline:none}
.runbtn{width:100%;padding:11px 0;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.runbtn:not(:disabled):hover{filter:brightness(1.18);transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.runbtn:disabled{cursor:not-allowed}
.clrbtn{width:100%;padding:6px 0;background:transparent;border:1px solid #111820;border-radius:7px;cursor:pointer;color:#3a4455;font-size:10px;font-family:inherit;transition:all .2s}
.clrbtn:hover{color:#778;border-color:#334}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#mgrid{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 12px 0}
.mcard{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 16px;position:relative;overflow:hidden;transition:border-color .5s,box-shadow .5s}
.mtopline{position:absolute;top:0;left:0;right:0;height:2px}
.mlabel{font-size:9px;color:#555;margin-bottom:4px;letter-spacing:.8px}
.mval{font-size:19px;font-weight:700;font-family:‘DM Mono’,‘Menlo’,monospace;color:#f0f0f0;transition:color .4s}
.mfooter{display:flex;align-items:center;gap:5px;margin-top:3px}
.mchange{font-size:10px}
.mmonth{font-size:9px;color:#444}
.mbadge{font-size:8px;animation:fadeUp .3s}
#tabbar{flex-shrink:0;display:flex;align-items:center;border-bottom:1px solid #111820;margin:8px 12px 0}
.tabbtn{background:none;border:none;padding:6px 14px;color:#3a4455;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:400;transition:all .2s;font-family:inherit}
.ldots{display:flex;align-items:center;gap:5px;padding-right:6px}
.dot{width:4px;height:4px;border-radius:50%}
.llabel{font-size:9px;color:#3a4455}
#chatwrap{flex:1;overflow:hidden;display:flex;flex-direction:column;margin:7px 12px 12px}
#chatscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:3px}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;animation:fadeUp .5s}
.eicon{font-size:48px;margin-bottom:14px}
.etitle{font-size:14px;font-weight:600;color:#334;margin-bottom:7px}
.edesc{font-size:11px;color:#2a3040;text-align:center;max-width:380px;line-height:1.9}
.echips{display:flex;gap:7px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.echip{background:#0a0e14;border:1px solid #111820;border-radius:20px;padding:3px 11px;font-size:9px;color:#3a4455}
.msgin{animation:fadeUp .25s ease}
.muserw{display:flex;justify-content:flex-end}
.muser{border-radius:9px 9px 2px 9px;padding:7px 12px;max-width:65%;font-size:11px;line-height:1.5}
.mutime{font-size:8px;margin-top:3px;text-align:right;opacity:.5}
.merr{background:rgba(255,71,71,.07);border:1px solid rgba(255,71,71,.15);border-radius:7px;padding:7px 11px;font-size:11px;color:#ff6b6b}
.mai{background:rgba(255,255,255,.02);border:1px solid #111820;border-radius:2px 9px 9px 9px;padding:11px 13px;max-width:95%}
.maihdr{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.aibdg{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#000;flex-shrink:0}
.aitime{font-size:9px;color:#3a4455}
.maibody{font-size:11px;color:#888;line-height:1.75}
.maibody h2{font-size:13px;margin:13px 0 6px;padding-bottom:4px;border-bottom-width:1px;border-bottom-style:solid}
.maibody h3{font-size:11px;color:#bbb;margin:9px 0 4px;font-weight:600}
.maibody .item{display:flex;gap:6px;margin-bottom:3px;font-size:11px;color:#888}
.maibody .arrow{flex-shrink:0}
.maibody p{font-size:11px;color:#888;margin:2px 0}
.maibody .sl{height:4px}
.cblink{animation:blink .8s infinite;color:#00d4ff}
#histwrap{flex:1;overflow-y:auto;margin:7px 12px 12px;display:flex;flex-direction:column;gap:7px}
.hrow{background:rgba(255,255,255,.02);border:1px solid #111820;border-radius:9px;padding:10px 13px;cursor:pointer;transition:border-color .2s}
.htop{display:flex;justify-content:space-between;margin-bottom:4px;align-items:center}
.hmeta{display:flex;gap:6px;align-items:center}
.htime{font-size:9px;color:#2a3040}
.hprev{font-size:10px;color:#445;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehist{flex:1;display:flex;align-items:center;justify-content:center;color:#334;font-size:12px}
</style>

</head>
<body>

<!-- TOPBAR -->

<div id="topbar">
  <button class="stoggle" id="togglebtn" onclick="toggleSidebar()">◀</button>
  <div class="logo-box">地</div>
  <div class="logo-text">
    <div class="t1">CA Real Estate Intelligence</div>
    <div class="t2">加州房地产实时信息 Agent</div>
  </div>
  <div class="spacer"></div>

  <!-- API Key input inline -->

  <div id="key-strip">
    <input id="key-inp" type="password" placeholder="粘贴 Anthropic API Key (sk-ant-...)" />
    <button id="key-btn" onclick="saveKey()">确认 Key</button>
    <span id="key-ok">✅ 已设置</span>
    <span id="key-err">❌ 请输入 Key</span>
  </div>

  <div class="tsec">
    <span class="tlabel">自动报告</span>
    <select class="tsel" id="autosel" onchange="setAutoInt()">
      <option value="0">关闭</option>
      <option value="300">5分钟</option>
      <option value="900">15分钟</option>
      <option value="1800">30分钟</option>
      <option value="3600">1小时</option>
    </select>
    <div class="barwrap" id="autobw" style="display:none"><div class="barfill" id="autobar" style="background:#a855f7;width:100%"></div></div>
    <span class="mono" id="autotl" style="display:none">--:--</span>
  </div>

  <div class="tsec">
    <span class="tlabel">指标刷新</span>
    <div class="barwrap"><div class="barfill" id="mbar" style="background:#00ff88;width:100%"></div></div>
    <span class="mono" id="mtl">30s</span>
    <span class="mono" id="lrl"></span>
  </div>

  <span class="ptag" style="background:rgba(0,255,136,.08);border-color:rgba(0,255,136,.2);color:#00ff88;font-size:9px">
    <span class="pdot" style="background:#00ff88;box-shadow:0 0 5px #00ff88"></span>LIVE
  </span>
  <span class="ptag" style="background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.2);color:#00d4ff;font-size:9px">
    <span class="pdot" style="background:#00d4ff;box-shadow:0 0 5px #00d4ff"></span>AI驱动
  </span>
</div>

<!-- LAYOUT -->

<div id="layout">

<!-- SIDEBAR -->

<div id="sidebar">
<div id="sb-inner">
  <div class="panel">
    <div class="plabel">市场类别</div>
    <div id="catlist"></div>
  </div>
  <div class="panel">
    <div class="plabel">目标地区</div>
    <div class="locchips" id="locchips"></div>
  </div>
  <div class="panel">
    <div class="plabel">报告类型</div>
    <div id="rtlist"></div>
  </div>
  <div class="panel">
    <div class="plabel">筛选条件</div>
    <div class="inprow">
      <input class="inp" id="pmin" placeholder="最低(万$)"/>
      <span class="sep">—</span>
      <input class="inp" id="pmax" placeholder="最高(万$)"/>
    </div>
    <div id="lafilters" style="display:none">
      <div class="fsubl">面积（英亩）</div>
      <div class="inprow">
        <input class="inp" id="amin" placeholder="最小"/>
        <span class="sep">—</span>
        <input class="inp" id="amax" placeholder="最大"/>
      </div>
      <select class="fsel" id="subsel"></select>
    </div>
    <div id="propfilter">
      <select class="fsel" id="propsel">
        <option>全部</option><option>独栋住宅</option><option>联排别墅</option>
        <option>公寓</option><option>商业用地</option><option>办公楼</option>
        <option>零售</option><option>工业</option>
      </select>
    </div>
  </div>
  <div class="panel">
    <div class="plabel">补充需求</div>
    <textarea class="custa" id="cq" rows="3" placeholder="例：重点关注学区、Cap Rate >5%..."></textarea>
  </div>
  <button class="runbtn" id="runbtn" onclick="runAgent()">🔍 启动市场分析</button>
  <button class="clrbtn" id="clrbtn" style="display:none" onclick="clearMsgs()">清空对话</button>
</div>
</div>

<!-- MAIN -->

<div id="main">
  <div id="mgrid"></div>
  <div id="tabbar">
    <button class="tabbtn" id="tabt-agent" onclick="switchTab('agent')">🤖 Agent 对话</button>
    <button class="tabbtn" id="tabt-hist" onclick="switchTab('hist')">📁 历史报告</button>
    <div class="spacer"></div>
    <div class="ldots" id="ldots" style="display:none">
      <div class="dot" id="d0" style="animation:pulse 1s 0s infinite"></div>
      <div class="dot" id="d1" style="animation:pulse 1s .18s infinite"></div>
      <div class="dot" id="d2" style="animation:pulse 1s .36s infinite"></div>
      <span class="llabel">正在搜索实时数据...</span>
    </div>
  </div>
  <div id="chatwrap">
    <div id="chatscroll">
      <div id="empty">
        <div class="eicon" id="eicon">🏙️</div>
        <div class="etitle">加州房地产智能分析 Agent</div>
        <div class="edesc">在顶栏输入 API Key 后，选择左侧类别和地区，点击<span id="espan" style="color:#00ff88">启动市场分析</span>。<br>顶部可设置<span style="color:#a855f7">自动报告</span>定时推送，指标卡每<span style="color:#00ff88">30秒</span>自动刷新。</div>
        <div class="echips">
          <span class="echip">🏢 商业地产 Cap Rate</span>
          <span class="echip">🏡 尔湾豪宅市场</span>
          <span class="echip">🌾 中央谷地农场</span>
          <span class="echip">🌍 开发用地 Zoning</span>
        </div>
      </div>
    </div>
  </div>
  <div id="histwrap" style="display:none">
    <div class="ehist" id="histempty">暂无历史报告</div>
  </div>
</div>
</div>

<script>
const CATS=[
  {id:'commercial',label:'加州商业地产',icon:'🏢',color:'#00d4ff'},
  {id:'residential',label:'南加州住宅',icon:'🏡',color:'#00ff88'},
  {id:'luxury',label:'豪宅市场',icon:'💎',color:'#ff6b35'},
  {id:'investment',label:'投资机会',icon:'📈',color:'#a855f7'},
  {id:'land',label:'土地出售',icon:'🌍',color:'#f59e0b'},
  {id:'agriculture',label:'农业地产',icon:'🌾',color:'#84cc16'},
];
const LOCS={
  commercial:['洛杉矶','旧金山','圣地亚哥','奥兰治县','硅谷','萨克拉门托'],
  residential:['尔湾','纽波特海滩','洛杉矶','圣地亚哥','帕萨迪纳','托斯汀'],
  luxury:['贝弗利山','马里布','拉古纳海滩','科罗纳德马尔','圣马力诺'],
  investment:['商业中心','工业园区','混合用途','公寓楼','零售物业'],
  land:['内陆帝国','圣贝纳迪诺县','河滨县','圣地亚哥东部','洛杉矶县','文图拉县'],
  agriculture:['中央谷地','圣华金谷','科切拉谷','纳帕谷','索诺玛','蒙特雷县','弗雷斯诺'],
};
const LSUB=['全部','住宅开发用地','商业开发用地','工业用地','混合用途地块','山地/景观地','滨水地块','农转非用地'];
const ASUB=['全部','葡萄园','果园','蔬菜农场','牧场/牛场','坚果农场','花卉农场','有机农场','休闲农庄'];
const RTS=[
  {id:'market_overview',label:'市场概览',desc:'整体市场趋势与数据'},
  {id:'price_analysis',label:'价格分析',desc:'最新成交价与挂牌价对比'},
  {id:'hot_listings',label:'热门房源',desc:'近期上市与成交案例'},
  {id:'investment_report',label:'投资报告',desc:'收益率、Cap Rate分析'},
  {id:'neighborhood',label:'社区分析',desc:'学区、配套设施评估'},
  {id:'forecast',label:'市场预测',desc:'未来3-6个月走势预测'},
  {id:'land_zoning',label:'土地分区规划',desc:'Zoning、用途许可与开发潜力'},
  {id:'agri_yield',label:'农业产能分析',desc:'作物产量、土壤与水源评估'},
];
const MET={
  def:[
    {label:'加州中位房价',base:865,unit:'K',pre:'$',chg:3.2,color:'#00d4ff'},
    {label:'OC住宅均价',base:1280,unit:'K',pre:'$',chg:1.8,color:'#00ff88'},
    {label:'库存月数',base:2.4,unit:'个月',pre:'',chg:-8,color:'#ff6b35'},
    {label:'LA商业空置率',base:18.3,unit:'%',pre:'',chg:2.1,color:'#a855f7'},
  ],
  land:[
    {label:'加州土地均价/英亩',base:28,unit:'K',pre:'$',chg:5.4,color:'#f59e0b'},
    {label:'开发用地库存',base:4820,unit:'块',pre:'',chg:-3.1,color:'#00d4ff'},
    {label:'南加州土地成交量',base:12,unit:'%',pre:'+',chg:12,color:'#00ff88'},
    {label:'平均在市天数',base:94,unit:'天',pre:'',chg:-8,color:'#ff6b35'},
  ],
  agriculture:[
    {label:'中央谷地均价/英亩',base:12.5,unit:'K',pre:'$',chg:4.2,color:'#84cc16'},
    {label:'葡萄园均价/英亩',base:85,unit:'K',pre:'$',chg:2.8,color:'#f59e0b'},
    {label:'农地成交宗数',base:1240,unit:'',pre:'',chg:6.5,color:'#00ff88'},
    {label:'水权溢价',base:35,unit:'%',pre:'+',chg:35,color:'#00d4ff'},
  ],
};

let apiKey='',cat='residential',loc='尔湾',rt='market_overview';
let loading=false,curTab='agent',collapsed=false;
let hist=[],msgs=[];
let liveV=[],prevV=[],msec=30,mTID=null;
let autoSec=0,autoTotal=0,autoTID=null,autoCID=null;
let typTID=null;

function gc(){return CATS.find(c=>c.id===cat)}

// ── API KEY ──
function saveKey(){
  const v=document.getElementById('key-inp').value.trim();
  if(!v){
    document.getElementById('key-err').style.display='inline';
    document.getElementById('key-ok').style.display='none';
    return;
  }
  apiKey=v;
  document.getElementById('key-ok').style.display='inline';
  document.getElementById('key-err').style.display='none';
  document.getElementById('key-inp').value='';
  document.getElementById('key-inp').placeholder='Key 已设置 ✓';
}

// ── INIT ──
function init(){
  renderCats();renderLocs();renderRTs();renderMetrics();
  resetMV();startMTimer();applyTheme();renderFilters();
  document.getElementById('lrl').textContent=new Date().toLocaleTimeString('zh-CN');

// ── METRICS ──
function getMK(){return['land','agriculture'].includes(cat)?cat:'def';}
function resetMV(){const d=MET[getMK()];liveV=d.map(m=>m.base);prevV=d.map(m=>m.base);}
function jit(b){return+(b*(1+(Math.random()-.5)*.025)).toFixed(b<10?2:0);}

function renderMetrics(flash=false){
  const defs=MET[getMK()];
  document.getElementById('mgrid').innerHTML=defs.map((m,i)=>{
    const lv=liveV[i]!==undefined?liveV[i]:m.base;
    const pv=prevV[i]!==undefined?prevV[i]:m.base;
    const upd=flash&&lv!==pv;
    const up=m.chg>=0;
    return`<div class="mcard" style="border-color:${upd?m.color+'55':'rgba(255,255,255,.06)'};box-shadow:${upd?`0 0 12px ${m.color}18`:'none'}">
      <div class="mtopline" style="background:linear-gradient(90deg,transparent,${m.color},transparent)"></div>
      <div class="mlabel">${m.label}</div>
      <div class="mval" style="color:${upd?m.color:'#f0f0f0'}">${m.pre}${lv}${m.unit}</div>
      <div class="mfooter">
        <span class="mchange" style="color:${up?'#00ff88':'#ff4757'}">${up?'↑':'↓'}${Math.abs(m.chg)}%</span>
        <span class="mmonth">较上月</span>
        ${upd?`<span class="mbadge" style="color:${m.color}">● 刷新</span>`:''}
      </div></div>`;
  }).join('');
}

// ── METRIC TIMER ──
function startMTimer(){
  if(mTID)clearInterval(mTID);
  msec=30;
  mTID=setInterval(()=>{
    msec--;
    document.getElementById('mbar').style.width=(msec/30*100)+'%';
    document.getElementById('mtl').textContent=msec+'s';
    if(msec<=0){
      prevV=[...liveV];
      liveV=MET[getMK()].map(m=>jit(m.base));
      renderMetrics(true);
      document.getElementById('lrl').textContent=new Date().toLocaleTimeString('zh-CN');
      msec=30;
      setTimeout(()=>renderMetrics(false),2500);
    }
  },1000);
}

// ── AUTO REPORT ──
function setAutoInt(){
  const val=parseInt(document.getElementById('autosel').value);
  clearInterval(autoTID);clearInterval(autoCID);
  const bw=document.getElementById('autobw'),tl=document.getElementById('autotl');
  if(!val){bw.style.display='none';tl.style.display='none';autoTotal=0;document.getElementById('autosel').style.color='#556';return;}
  autoTotal=val;autoSec=val;
  bw.style.display='block';tl.style.display='inline';
  document.getElementById('autobar').style.background=gc().color;
  document.getElementById('autosel').style.color=gc().color;
  updAutoBar();

  autoTID=setInterval(()=>{runAgent();autoSec=autoTotal;},val*1000);
}
function updAutoBar(){
  document.getElementById('autobar').style.width=(autoTotal>0?autoSec/autoTotal*100:0)+'%';
  const m=Math.floor(autoSec/60),s=autoSec%60;
  document.getElementById('autotl').textContent=m+':'+String(s).padStart(2,'0');

function switchTab(t){

// ── MESSAGES ──
function clearMsgs(){msgs=[];if(typTID)clearInterval(typTID);renderMsgs();document.getElementById('clrbtn').style.display='none';}

function renderMsgs(){
  const c=gc();
  const sc=document.getElementById('chatscroll');
  const em=document.getElementById('empty');
  if(msgs.length===0){sc.innerHTML='';sc.appendChild(em);em.style.display='flex';return;}
  em.style.display='none';
  sc.innerHTML='';
  msgs.forEach((msg,i)=>{
    const div=document.createElement('div');
    div.className='msgin';
    if(msg.role==='user'){
      div.innerHTML=`<div class="muserw"><div class="muser" style="background:${c.color}12;border:1px solid ${c.color}30;color:${c.color}">${esc(msg.content)}<div class="mutime">${msg.time}</div></div></div>`;
    } else if(msg.role==='error'){
      div.innerHTML=`<div class="merr">⚠️ ${esc(msg.content)}</div>`;
    } else {
      const body=i===msgs.length-1&&msg.typing
        ?`<span id="tspan">${esc(msg.shown||'')}</span><span class="cblink">▋</span>`
        :fmtMd(msg.content,c.color);
      div.innerHTML=`<div class="mai">
        <div class="maihdr">
          <div class="aibdg" style="background:linear-gradient(135deg,${c.color},${c.color}55)">AI</div>
          <span class="aitime">市场分析报告 · ${msg.time}</span>
          ${msg.meta?ptag(msg.meta.loc,c.color,9):''}
          ${msg.auto?ptag('自动','#a855f7',8):''}
        </div>
        <div class="maibody" id="body${i}">${body}</div>
      </div>`;
    }
    sc.appendChild(div);
  });
  sc.scrollTop=sc.scrollHeight;
}

function ptag(label,color,sz){
  return`<span class="ptag" style="background:${color}15;border-color:${color}35;color:${color};font-size:${sz}px"><span class="pdot" style="background:${color};box-shadow:0 0 5px ${color}"></span>${esc(label)}</span>`;
}

function fmtMd(text,color){
  return text.split('\n').map(line=>{
    if(line.startsWith('## '))return`<h2 style="color:${color};border-bottom-color:${color}25">${esc(line.slice(3))}</h2>`;
    if(line.startsWith('### '))return`<h3>${esc(line.slice(4))}</h3>`;
    if(line.startsWith('- '))return`<div class="item"><span class="arrow" style="color:${color}">›</span><span>${esc(line.slice(2))}</span></div>`;
    if(/^\d+\./.test(line))return`<p>${esc(line)}</p>`;
    if(!line.trim())return`<div class="sl"></div>`;
    return`<p>${esc(line)}</p>`;
  }).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function startTyping(idx,full){
  if(typTID)clearInterval(typTID);
  let i=0;const c=gc();
  msgs[idx].shown='';msgs[idx].typing=true;
  typTID=setInterval(()=>{
    if(i<full.length){
      i++;msgs[idx].shown=full.slice(0,i);
      const sp=document.getElementById('tspan');
      if(sp)sp.innerHTML=esc(msgs[idx].shown);
      const sc=document.getElementById('chatscroll');
      sc.scrollTop=sc.scrollHeight;
    } else {
      clearInterval(typTID);msgs[idx].typing=false;
      const be=document.getElementById('body'+idx);
      if(be)be.innerHTML=fmtMd(full,c.color);
    }
  },8);
}

// ── HISTORY ──
function renderHist(){
  const c=gc();
  const wrap=document.getElementById('histwrap');
  const em=document.getElementById('histempty');
  if(hist.length===0){em.style.display='flex';return;}
  em.style.display='none';
  wrap.querySelectorAll('.hrow').forEach(el=>el.remove());
  hist.forEach(msg=>{
    const div=document.createElement('div');
    div.className='hrow';
    div.innerHTML=`<div class="htop"><div class="hmeta">${ptag(msg.meta?.loc||'?',c.color,9)}<span style="font-size:9px;color:#3a4455">${esc(msg.meta?.cat||'')}</span>${msg.auto?ptag('自动','#a855f7',8):''}</div><span class="htime">${msg.time}</span></div><div class="hprev">${esc(msg.content.slice(0,140))}...</div>`;
    div.onclick=()=>{msgs=[msg];renderMsgs();switchTab('agent');};
    div.onmouseenter=()=>div.style.borderColor=c.color+'35';
    div.onmouseleave=()=>div.style.borderColor='#111820';
    wrap.appendChild(div);
  });
  document.getElementById('tabt-hist').textContent=`📁 历史报告 (${hist.length})`;
}

// ── BUILD PROMPT ──
function buildPrompt(){
  const c=gc();
  const rl=RTS.find(r=>r.id===rt)?.label;
  const pmin=document.getElementById('pmin').value;
  const pmax=document.getElementById('pmax').value;
  const pr=pmin||pmax?`价格区间：${pmin||'不限'}万-${pmax||'不限'}万美元，`:'';
  const prop=document.getElementById('propsel').value;
  const tf=prop!=='全部'?`物业类型：${prop}，`:'';
  const la=cat==='land'||cat==='agriculture';
  const sub=la?document.getElementById('subsel')?.value:'';
  const sf=la&&sub&&sub!=='全部'?`细分类型：${sub}，`:'';
  const amin=la?document.getElementById('amin').value:'';
  const amax=la?document.getElementById('amax').value:'';
  const ac=amin||amax?`面积：${amin||'不限'}-${amax||'不限'}英亩，`:'';
  const cq=document.getElementById('cq').value;
  const cx=cq?`\n补充需求：${cq}`:'';
  const ls=cat==='land'?'\n### 土地开发潜力\n- Zoning分类与允许用途\n- 开发限制（坡度、水源、消防）\n- 基础设施接入（水电、道路）\n- 近期类似地块成交案例':'';
  const as=cat==='agriculture'?'\n### 农业生产条件\n- 土壤质量与类型（Soil Class）\n- 水源保障（地下水权、灌溉渠道）\n- 作物适应性与历史产量\n- 农业补贴与税收优惠（Williamson Act等）':'';
  const inv=cat==='land'?'土地增值潜力、开发时间线、持有成本':cat==='agriculture'?'农业回报率、租地/自营对比、土地增值与补贴':cat==='commercial'?'Cap Rate范围、租金回报率、空置率':'租金收益潜力、增值空间、社区评级';
  return`你是专业的加州房地产市场分析师。\n\n📍 类别：${c.label} | 📌 地区：${loc} | 📋 报告：${rl}\n${pr}${tf}${sf}${ac}${cx}\n\n请按结构提供报告（中文，专业详尽）：\n\n## 📊 市场快讯（${new Date().toLocaleDateString('zh-CN')}）\n\n### 核心数据\n- 当前中位价格与同比变化${la?'\n- 每英亩均价与成交量':''}\n- 月度交易量与库存水平\n- 平均在市天数（DOM）\n- 挂牌价/成交价比率\n\n### 市场动态\n买卖双方力量对比、竞争程度、融资环境影响。\n${ls}${as}\n\n### 热点区域/项目\n列举3-5个值得关注的具体地区或地块，含价格、面积和特点。\n\n### 投资视角\n${inv}\n\n### 市场展望\n未来1-3个月走势预测，关键风险与机会。\n\n### 行动建议\n针对买家/投资者的3条可执行建议。\n\n请确保数据具体，分析深入，优先引用最新数据。`;
}

// ── RUN AGENT ──
async function runAgent(){
  if(loading)return;
  if(!apiKey){
    alert('请先在顶栏输入并确认 API Key！');
    document.getElementById('key-inp').focus();
    return;
  }
  loading=true;switchTab('agent');
  const c=gc();
  const rb=document.getElementById('runbtn');
  rb.disabled=true;rb.style.background='#0a0e14';rb.style.border='1px solid #1a2030';rb.style.color='#3a4455';
  rb.innerHTML='<span style="animation:pulse .9s infinite">⏳</span> 分析中...';
  document.getElementById('ldots').style.display='flex';
  const time=new Date().toLocaleTimeString('zh-CN');
  msgs.push({role:'user',content:`🔍 ${c.label} | ${loc} | ${RTS.find(r=>r.id===rt)?.label}`,time});
  renderMsgs();
  document.getElementById('clrbtn').style.display='block';
  try{
    const res=await fetch('https://portfolio-proxy.karenhj1991.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:buildPrompt()}]})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n')||'未能获取市场数据，请稍后重试。';
    const am={role:'assistant',content:text,time:new Date().toLocaleTimeString('zh-CN'),meta:{loc,cat:c.label,rt},auto:autoTotal>0,shown:'',typing:true};
    msgs.push(am);renderMsgs();startTyping(msgs.length-1,text);
    hist.unshift(am);if(hist.length>20)hist.pop();
  }catch(e){
    msgs.push({role:'error',content:'请求失败：'+(e.message||'请检查 API Key 和网络后重试'),time:new Date().toLocaleTimeString('zh-CN')});
    renderMsgs();
  }
  loading=false;
  rb.disabled=false;rb.style.background=`linear-gradient(135deg,${c.color},${c.color}cc)`;
  rb.style.border=`1px solid ${c.color}55`;rb.style.color='#000';
  rb.textContent='🔍 启动市场分析';
  document.getElementById('ldots').style.display='none';
}
